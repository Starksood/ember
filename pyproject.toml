[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-custody"
version = "0.2.1"
description = "Cryptographic custody, redactable Merkle receipts, and verifiable cascade erasure for AI memory and RAG stores."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Sanyam Sood", email = "sasood01@wsc.edu" },
]
keywords = [
  "ai-memory",
  "gdpr",
  "right-to-be-forgotten",
  "crypto-shredding",
  "merkle-tree",
  "provenance",
  "mem0",
  "rag",
  "audit-log",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "cryptography>=42.0",
]

[project.optional-dependencies]
mem0 = ["mem0ai>=0.1.0"]
qdrant = ["qdrant-client>=1.9.0"]
chroma = ["chromadb>=0.5.0"]
postgres = ["psycopg>=3.1.0"]
pinecone = ["pinecone>=5.0.0"]
langchain = ["langchain-core>=0.2.0"]
llamaindex = ["llama-index-core>=0.10.0"]
aws = ["boto3>=1.34.0"]
gcp = ["google-cloud-kms>=2.21.0"]
server = ["starlette>=0.38.0", "uvicorn>=0.30.0"]
mcp = ["mcp>=1.0.0"]
all = [
  "mem0ai>=0.1.0",
  "qdrant-client>=1.9.0",
  "chromadb>=0.5.0",
  "psycopg>=3.1.0",
  "pinecone>=5.0.0",
  "langchain-core>=0.2.0",
  "llama-index-core>=0.10.0",
  "boto3>=1.34.0",
  "google-cloud-kms>=2.21.0",
  "starlette>=0.38.0",
  "uvicorn>=0.30.0",
  "mcp>=1.0.0",
]
dev = ["pytest>=8.0", "ruff>=0.6.0", "build>=1.0.0"]

[project.scripts]
ember = "ember.cli:main"
ember-mcp = "ember.mcp_server:main"
ember-verify = "ember.verify:main"

[project.urls]
Homepage = "https://github.com/Starksood/ember"
Repository = "https://github.com/Starksood/ember"
Issues = "https://github.com/Starksood/ember/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "B", "W", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
