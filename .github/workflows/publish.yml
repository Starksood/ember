name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint, build, and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package, test dependencies, build, and twine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build twine
      - name: Run static security lint, test suite, and benchmark
        run: |
          ruff check src tests examples
          pytest -v
          ember benchmark
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate distributions with twine
        run: twine check dist/*
      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: ember-custody-dist
          path: dist/

  publish:
    name: Publish ember-custody to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ember-custody
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: ember-custody-dist
          path: dist/
      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
