name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Static security and bugbear lint
        run: ruff check src tests examples
      - name: Run unit, integration, adversarial, and calibration tests
        run: pytest -v
      - name: Run 12-subject x 7-class erasure benchmark
        run: ember benchmark
